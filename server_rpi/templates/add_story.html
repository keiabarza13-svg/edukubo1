<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Story & Question - EduKubo</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        .section-title { margin-top: 25px; border-bottom: 2px solid #ddd; padding-bottom: 5px; color: #333; }
        .submit-btn { background-color: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; font-size: 1em; cursor: pointer; }
        .back-btn { text-decoration: none; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <a href="{{ url_for('teacher_dashboard') }}" class="back-btn">← Back to Dashboard</a>
    <h2>Add New Story & Question</h2>

    <form method="POST">
        <!-- STORY DETAILS -->
        <div class="form-group">
            <label>Story Title:</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Grade Level:</label>
            <input type="number" name="grade_level" min="1" max="12" value="4" required>
        </div>

        <div class="form-group">
            <label>IRT Difficulty Level (e.g., -1.5 to 1.5):</label>
            <input type="number" step="0.1" name="difficulty_level" value="0.0" required>
        </div>

        <div class="form-group">
            <label>Story Content:</label>
            <textarea name="content" rows="6" required></textarea>
        </div>

        <div class="form-group">
            <label>
                <input type="checkbox" name="is_baseline" value="1"> Set as Baseline Assessment Story
            </label>
        </div>

        <!-- QUESTION DETAILS -->
        <h3 class="section-title">Add Question</h3>

        <div class="form-group">
            <label>Skill Type:</label>
            <select name="skill_id">
                <option value="Literal">Literal</option>
                <option value="Inferential">Inferential</option>
                <option value="Critical">Critical</option>
            </select>
        </div>

        <div class="form-group">
            <label>Question Sentence:</label>
            <input type="text" name="question_text">
        </div>

        <div class="form-group"><label>Option A:</label><input type="text" name="option_a"></div>
        <div class="form-group"><label>Option B:</label><input type="text" name="option_b"></div>
        <div class="form-group"><label>Option C:</label><input type="text" name="option_c"></div>
        <div class="form-group"><label>Option D:</label><input type="text" name="option_d"></div>

        <div class="form-group">
            <label>Correct Answer (Exact text matching Option A/B/C/D):</label>
            <input type="text" name="correct_answer">
        </div>

        <div class="form-group">
            <label>Question Difficulty (IRT):</label>
            <input type="number" step="0.1" name="q_difficulty_level" value="0.0">
        </div>

        <button type="submit" class="submit-btn">Save Story & Question to Database</button>
    </form>
</div>

</body>
</html>
